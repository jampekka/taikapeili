<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b09"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="An automatic haunted mirror."><title>The Other Side</title><link rel="stylesheet" href="style.css"></head><body>
<section id="audioGate"><p id="audioGateMessage">Napauta avataksesi peilin ja käynnistääksesi äänet.</p><button id="startMirror">Avaa peili</button></section>
<main hidden id="mirror" aria-label="Haunted mirror" data-phase="starting" data-faces="0">
<div class="glass" id="glass"><video id="camera" autoplay muted playsinline aria-label="Live mirror"></video><canvas id="atmosphere" aria-label="Animated mirror"></canvas><canvas id="reflection" aria-label="Haunted reflection" hidden></canvas><canvas id="tracking" aria-label="Face detection debug overlay" hidden></canvas><div id="startup" role="status" aria-live="polite"><span id="message">Opening the mirror…</span><button id="enable" hidden>Enable camera</button></div></div>
<div class="lights" id="lights" aria-hidden="true"></div>
<div id="runError" hidden><p id="errorText"></p><button id="retry">Uudelleen</button></div>
<div id="ritualText" aria-live="polite" hidden></div>

</main>
<aside id="debug" hidden aria-label="Mirror debug"><details open><summary>Mirror debug</summary><pre id="debugState"></pre><div class="debug-row"><button id="testSound">Test sound</button><button id="testScare">Run sequence</button></div><p id="settingsStatus">Settings save automatically in this browser.</p><label>Loppupuhe<select id="ending"><option value="invite">Lähetä seuraava luokseni</option><option value="secret">Älä kerro minusta kenellekään</option></select></label><p id="endingCopy"></p><button id="testEnding">Test ending</button><label>Scream sound<select id="scream"></select></label><label>Second scare after ending<select id="encore"><option value="off">Off</option><option value="short">Short · 450 ms</option><option value="original">Same as original · 650 ms</option></select></label><label>Volume<input id="volume" type="range" min="0" max="100" value="65"></label><label class="check"><input id="showTexts" type="checkbox"> Sequence texts</label><label class="check"><input id="boxes" type="checkbox" checked> Detection overlay</label><label for="closeWidth">Close face width <output id="closeWidthValue" for="closeWidth">45%</output><input id="closeWidth" type="range" min="20" max="90" value="45"></label><label>Morph strength<input id="morph" type="range" min="0" max="100" value="70"></label><pre id="debugEvents"></pre></details></aside>
<script type="module" src="app.js"></script></body></html>
