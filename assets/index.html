<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b09"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="An automatic haunted mirror."><title>The Other Side</title><link rel="stylesheet" href="style.css"></head><body>
<section id="audioGate"><p id="audioGateMessage">Napauta avataksesi peilin ja käynnistääksesi äänet.</p><button id="startMirror">Avaa peili</button></section>
<main hidden id="mirror" aria-label="Haunted mirror" data-phase="starting" data-faces="0">
<div class="glass" id="glass"><video id="camera" autoplay muted playsinline aria-label="Live mirror"></video><canvas id="atmosphere" aria-label="Animated mirror"></canvas><canvas id="reflection" aria-label="Haunted reflection" hidden></canvas><canvas id="tracking" aria-label="Face detection debug overlay" hidden></canvas><div id="startup" role="status" aria-live="polite"><span id="message">Opening the mirror…</span><button id="enable" hidden>Enable camera</button></div></div>
<div class="lights" id="lights" aria-hidden="true"></div>
<div id="runError" hidden><p id="errorText"></p><button id="retry">Uudelleen</button></div>
<div id="ritualText" aria-live="polite" hidden></div>

</main>
<aside id="debug" hidden aria-label="Mirror debug"><details open><summary>Mirror debug</summary><pre id="debugState"></pre><div class="debug-row"><button id="testSound">Test sound</button><button id="testScare">Run sequence</button></div><label>Volume<input id="volume" type="range" min="0" max="100" value="65"></label><label class="check"><input id="showTexts" type="checkbox"> Sequence texts</label><label class="check"><input id="boxes" type="checkbox" checked> Detection overlay</label><label>Close face width<input id="closeWidth" type="range" min="20" max="90" value="45"></label><label>Morph strength<input id="morph" type="range" min="0" max="100" value="70"></label><form id="providerForm"><h2>Image model</h2><p id="serverKeyStatus">Checking server key…</p><label>Model<input id="apiModel" list="imageModels" value="gpt-image-2.5-flare" spellcheck="false"></label><datalist id="imageModels"><option value="gpt-image-2.5-flare"><option value="google/gemini-3.1-flash-lite-image"><option value="google/gemini-3.1-flash-image"><option value="google/gemini-2.5-flash-image"><option value="black-forest-labs/flux.2-klein-4b"></datalist><p>Automatic captures send face photos to the selected image provider. Requests are billed. The key stays on the server.</p><div class="debug-row"><button type="submit">Use image model</button><button id="useLocal" type="button">Use dummy</button></div></form><p id="providerStatus" role="status"></p><pre id="debugEvents"></pre></details></aside>
<script type="module" src="app.js"></script></body></html>
