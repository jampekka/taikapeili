<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b09"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="An automatic haunted mirror."><title>The Other Side</title><link rel="stylesheet" href="style.css"></head><body>
<main id="mirror" aria-label="Haunted mirror" data-phase="starting" data-faces="0">
<div class="glass" id="glass"><video id="camera" autoplay muted playsinline aria-label="Live mirror"></video><canvas id="reflection" aria-label="Haunted reflection"></canvas><canvas id="tracking" aria-label="Face detection debug overlay" hidden></canvas><div id="startup" role="status" aria-live="polite"><span id="message">Opening the mirror…</span><button id="enable" hidden>Enable camera</button></div></div>
<div class="lights lights-top" aria-hidden="true"><i></i><i></i><i></i></div><div class="lights lights-bottom" aria-hidden="true"><i></i><i></i><i></i></div><div class="lights lights-left" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="lights lights-right" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<button id="armAudio" class="sound-prompt" hidden>Tap once for sound</button>
</main>
<aside id="debug" hidden aria-label="Mirror debug"><details open><summary>Mirror debug</summary><pre id="debugState"></pre><div class="debug-row"><button id="testSound">Test sound</button><button id="testScare">Reveal now</button></div><label>Sound<select id="sound"><option value="random">Random</option><option value="shriek">Shriek</option><option value="sting">Orchestral stab</option><option value="growl">Monster growl</option></select></label><label>Volume<input id="volume" type="range" min="0" max="100" value="65"></label><label class="check"><input id="boxes" type="checkbox" checked> Detection overlay</label><form id="providerForm"><h2>Image model</h2><p id="serverKeyStatus">Checking server key…</p><label>Model<input id="apiModel" list="imageModels" value="google/gemini-3.1-flash-lite-image" spellcheck="false"></label><label>Output size<select id="resolution"><option value="auto">Model default</option><option value="512">512px (supported models)</option><option value="1K">1K (supported models)</option></select></label><datalist id="imageModels"><option value="google/gemini-3.1-flash-lite-image"><option value="google/gemini-3.1-flash-image"><option value="google/gemini-2.5-flash-image"><option value="black-forest-labs/flux.2-klein-4b"></datalist><p>Automatic captures send face photos to OpenRouter and its model provider. Requests are billed. The key stays on the server.</p><div class="debug-row"><button type="submit">Use image model</button><button id="useLocal" type="button">Use dummy</button></div></form><p id="providerStatus" role="status"></p><pre id="debugEvents"></pre></details></aside>
<script type="module" src="app.js"></script></body></html>
